spring:
  application:
    name: wegrow-api
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:15432/wegrow_db}"
    username: "${DB_USERNAME:app_user}"
    password: "${DB_PASSWORD:${POSTGRES_PASSWORD}}"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

server:
  port: "${SERVER_PORT:8080}"
